# Cada domingo trae el blog de Erika (Substack) a feed.json y lo sube; eso
# dispara la Action de publicar (deploy.yml), que regenera la web.
# Se lo pide a un servidor en Render (index.js): Substack contesta 403 a las
# máquinas de GitHub, también con cabecera de navegador (probado el 2026-10-18).
name: Actualizar feed JSON domingo a las 12 UTC

on:
  schedule:
    - cron: '0 12 * * 0'  # cada domingo a las 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Descargar el feed desde Render
        run: |
          curl -s --max-time 120 https://blog-scrapper-jmsb.onrender.com/feed > nuevo.json
          # solo si ha llegado un feed con entradas: si no, se queda el de antes
          node -e 'const f=JSON.parse(require("fs").readFileSync("nuevo.json","utf8")); if(!f.items?.length) process.exit(1)' \
            && mv nuevo.json feed.json || { echo "el feed no ha llegado bien: se queda el de antes"; rm -f nuevo.json; }

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add feed.json
          git diff --cached --quiet || git commit -m "Actualizar feed diario"
          git push
