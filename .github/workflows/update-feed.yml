# Cada domingo trae el blog de Erika (Substack) a feed.json y lo sube; eso
# dispara la Action de publicar (deploy.yml), que regenera la web.
# Antes se lo pedía a un servidor en Render; ahora lo hace build/feed.mjs aquí.
name: Actualizar feed JSON domingo a las 12 UTC

on:
  schedule:
    - cron: '0 12 * * 0'  # cada domingo a las 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Traer el feed de Substack
        run: npm ci && node build/feed.mjs

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add feed.json
          git diff --cached --quiet || git commit -m "Actualizar feed diario"
          git push
